name: Coverage

# Line coverage of src/ from the hermetic suites plus the live cucumber suite
# (the spawned pocket-id-mcp binary is instrumented too, so tool bodies that
# only run against a real Pocket ID count). On pushes to main the result is
# published as a shields.io endpoint badge on the orphan `coverage` branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    name: Line coverage (hermetic + live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Pull Pocket ID image
        run: docker pull ghcr.io/pocket-id/pocket-id:v2.13.0

      - name: Hermetic suites
        run: cargo llvm-cov --no-report test

      - name: Live suite against a real Pocket ID
        run: POCKET_ID_LIVE=1 cargo llvm-cov --no-report test --test live

      - name: Report
        id: report
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          t = json.load(open("coverage.json"))["data"][0]["totals"]
          lines = t["lines"]["percent"]
          color = ("brightgreen" if lines >= 80 else "green" if lines >= 70 else
                   "yellowgreen" if lines >= 60 else "yellow" if lines >= 50 else "orange")
          print(f"lines={lines:.1f}")
          print(f"color={color}")
          json.dump({"schemaVersion": 1, "label": "coverage", "message": f"{lines:.1f}%",
                     "color": color}, open("badge.json", "w"))
          with open("summary.md", "w") as f:
              f.write("| | covered |\n|---|---|\n")
              for k in ("lines", "regions", "functions"):
                  f.write(f"| {k} | {t[k]['percent']:.1f}% |\n")
          PY
          { echo "## Coverage (hermetic + live)"; cat summary.md; } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json
            coverage-html

      # The badge lives on an orphan branch so README can embed it via
      # shields.io's endpoint badge without any third-party account.
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badge && cp badge.json lcov.info coverage.json summary.md badge/
          cd badge
          git init -q -b coverage
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "coverage: ${{ steps.report.outputs.lines }}% lines (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" coverage
