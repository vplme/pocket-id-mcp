name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test (includes spec coverage accounting)
        run: cargo test

  live:
    name: Live integration (Pocket ID in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned to the Pocket ID release the vendored spec describes (see
      # tests/live/common.rs); the weekly spec-drift workflow tracks upstream.
      - name: Pull Pocket ID image
        run: docker pull ghcr.io/pocket-id/pocket-id:v2.13.0

      - name: Live suite against a real Pocket ID (cucumber features)
        run: POCKET_ID_LIVE=1 cargo test --test live
